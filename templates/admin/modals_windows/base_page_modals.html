{% macro edit_avatar() %}
        <div class="modal-dialog modal-xl modal-lg modal-dialog-centered">
            <div class="modal-content" style="background: #969595e4;">
                <div class="modal-header">
                    <button type="button" onclick="removeFileAvatar(this)" class="btn-close btn-close-black" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-6">
                                <div class="position-relative my-relative">
                                    <div class="btn-container">
                                        <div class="btn-container-inner">
                                            <label class="input-file edit-avatar-div">
                                                <input type="file" id="editAvatar" name="file[]" accept="image/*" onchange="addPreviewAvatar(this)">
                                                <span class="input-file-btn">Выберите файл</span>
                                            </label>
                                        </div>
                                        <button type="button" name="saveAvatar" class="btn btn-dark" disabled="true" onclick="sendNewAvatar(this)">Сохранить изменения</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 preview-div">
                                <div class="input-file-preview"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endmacro %}
