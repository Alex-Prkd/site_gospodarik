{% extends "/admin/base.html" %}

{% block title %} Главная страница {% endblock %}

{% block load_css %}
    <style>
        .flash-message {
            padding: 10px;
            background-color: #3ea4ed;
            color: white;
            border-radius: 5px;
            margin: 10px 0;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }
        .fade-out{
            opacity: 0;
            }
    </style>
    <link rel="stylesheet" href="../static/css/admin_main_page.css">
{% endblock %}

{% block quote_on_main_page %}
    <div id="content-quote">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea class="d-grid gap-2 col-6 mx-auto" rows="5" placeholder="{{preview}}"></textarea>
        <div style="text-align:center; margin-bottom: 5%; margin-top: 1%">
            <input type="submit" value="Сохранить" class="btn btn-success" onclick="editQuote(this)">
        </div>
    </div>
{% endblock %}

{% block main %}
    <div class="d-grid gap-2 col-6 mx-auto">
        <form method="post" action="/admin/add_new_photo/" enctype="multipart/form-data" id="addPhotoForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-file-row d-grid col-6 mx-auto">
                <label class="input-file new-photo">
                    <input type="file" id="btn_add_photo" name="file[]" multiple accept="image/*">
                    <span>Добавить фото</span>
                </label>
                <div class="input-file-list"></div>
            </div>
            <div class="input-file-row d-grid col-6 mx-auto">
                <input class="btn btn-success" type="submit" id="submit_save" value="Отправить" onclick="sendPhotoTest()" disabled style="margin-bottom: 12px;">
            </div>
        </form>
    </div>
    <section class="gallery-section">
        <div class="container-fluid">
            <div class="row g-1 justify-content-center gallery">
                {% for image in images %}
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-4 col-4">
                    <form method="post" action="/admin/">
                        <input type="hidden" id="csrf_token" value="{{ csrf_token() }}">
                        <div class="gallery-item h-100">
                            <a href="../static/img/photos/{{ image }}" data-fancybox="">
                                <img src="../static/img/photos/{{ image }}" height="2400px" width="1600px" decoding="async" class="img-class"  alt=""
                                            srcset="../static/img/photos/{{ image }} 1400w,
                                            ../static/img/middle_size/{{ image }} 1280w,
                                            ../static/img/small_size/{{ image }} 960w
                                            "
                                >
                            </a>
                        </div>
                        <div class="d-grid gap-2 col-6 mx-auto">

                            <input class="btn btn-danger" type="button" value="Удалить" onclick="removePhoto('{{image}}')">
                        </div>
                    </form>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>

    <div class="container text-white">
        <div class="text-social">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <textarea rows="3" placeholder="{{info_footer}}"></textarea>
            <input type="button" class="btn btn-success" value="Сохранить" onclick="editFollowMeText(this)">
        </div>
    </div>

    <div class="container text-white">
        <div class="text-social">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <textarea rows="3" placeholder="{{link_footer}}"></textarea>
            <input type="button" class="btn btn-success" value="Сохранить" onclick="editLinkFollowMe(this)">
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../static/js/admin/add_new_photo.js"></script>
    <script src="../static/js/admin/main_page/main_page.js"></script>
    <script src="../static/js/admin/remove_photo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script src="../static/js/zoom-img.js"></script>
{% endblock %}
