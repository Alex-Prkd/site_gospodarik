<body >

<header class="header-black">

    <nav class="navbar navbar-expand navbar-dark bg-black fixed-top">
    <div class="container-md ">
<!--        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">-->
<!--            <span class="navbar-toggler-icon"></span>-->
<!--        </button>-->

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto mr-auto">
                <li class="nav-item"><a class="nav-link" href="#home">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="#pricing">Прайс на съёмку</a></li>

            </ul>
        </div>
    </div>

    <div class="inner">
        <a href="" >
            <canvas class="logo-img" id="canvas">
            </canvas>
        </a>
    </div>
    <section class="container home text-center">
        <p>Текст</p>
    </section>
</header>

    <main>

        <section class="gallery-section">
            <div class="container-fluid">
                <div class="row g-1 justify-content-center gallery">
                    {% for image in images %}
                    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-4 col-4">

                        <div class="gallery-item h-100">
                            <a href="static/img/photos/{{ image }}" data-fancybox="">
                                <img src="static/img/photos/{{ image }}" loading="lazy" height="" width="" decoding="async" class="img-class"  alt="">
                            </a>
                        </div>


                    </div>
                    {% endfor %}
                </div>
            </div>
        </section>


        <div class="btn-div">

    <div class="TopBtn">
        <a id="toTopBtn" class="btn btn-dark">
            <i  class="bi bi-arrow-up"></i>
        </a>
    </div>

    <div class="btn-social-link">
        <a href="" class="social-link">
            <span class="tooltip-text">Связь со мной</span>
            <img src="static/img/link/logo-link3.jpg" class="logo-link">
        </a>
    </div>
</div>

    </main>
    <footer>
        <section id="social" class="container text-white">
            <div class="text-social">
                <p>Следите за моими работами в Instagram:</p>
                <p>@n_gospodarik</p>
            </div>
            <div class="box-social">
                    <ul class="link-social">
                        <li><a class="btn btn-dart" href="https://telegram.me/username" target="_blank"><i class="bi bi-telegram"></i></a></li>
                        <li><a class="btn btn-dart" href="https://instagram.com/username" target="_blank"><i class="bi bi-instagram"></i></a></li>
                    </ul>
            </div>
        </section>
    </footer>

    <script src="static/js/zoom-img.js"></script>
