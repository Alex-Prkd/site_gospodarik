<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{%endblock %}</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>

    <link href='https://fonts.googleapis.com/css?family=Bellota' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Alegreya Sans' rel='stylesheet'>

    <link rel="stylesheet" href="static/css/main.css">
    {% block load_css %}{% endblock %}
</head>
<body>
<header>
    <nav class="navbar navbar-expand navbar-light bg-light fixed-top">
        <div class="container-md ">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/price">Прайс на съёмку</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reviews">Отзывы</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contacts">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="inner">
        <a href="" class="icon svg-icon">
<!--            <canvas class="logo-img" id="canvas" width="925" height="200"></canvas>-->
        </a>
    </div>
    {% block quote_on_main_page %}{% endblock %}
</header>

<main>
    {% block main %}{% endblock %}
    <div class="btn-div">
        <div class="TopBtn">
            <a id="toTopBtn" class="btn btn-dark">
                <i  class="bi bi-arrow-up"></i>
            </a>
        </div>
        <div class="btn-social-link">
            <a href="" class="social-link">
                <span class="tooltip-text">Связь со мной</span>
                <img src="static/img/link/{{ avatar }}" class="logo-link">
            </a>
        </div>
    </div>
</main>
<footer>
    {% block footer %}{% endblock %}
    <div class="box-social">
            <ul class="link-social">
                <li><a class="btn btn-dart" href="{{ telegram }}" target="_blank"><i class="bi bi-telegram"></i></a></li>
                <li><a class="btn btn-dart" href="{{ instagram }}" target="_blank"><i class="bi bi-instagram"></i></a></li>
            </ul>
        </div>
</footer>
{% block scripts %}{% endblock %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="static/js/script.js"></script>
</body>
</html>
